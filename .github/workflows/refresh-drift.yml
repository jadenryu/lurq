# Refreshes the landing page's version-drift leaderboard once a day.
#
# The board is static content read at build time, not a live query, so no visitor
# ever touches the database no matter how much traffic the page gets. The tradeoff
# is that the numbers age, and a board about staleness going stale would be a bad
# look. Once a day is enough: majors do not ship by the hour.
#
# The generator is a single read-only SELECT (scripts/gen-drift.ts). It writes
# nothing to the database.
name: refresh drift board

on:
  schedule:
    # 07:30 UTC. The heavy nightly sync starts at 06:00 (railway.json), so this
    # clears it by 90 minutes. lurq-discover writes every 15 minutes all day
    # (railway.discover.json), so there is no quiet window to aim for; the only
    # thing worth avoiding is reading the index while the bulk write is running.
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- apps/web/src/content/generated/drift.json; then
            echo "drift.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "lurq bot"
          git config user.email "bot@lurq.run"
          git add apps/web/src/content/generated/drift.json
          git commit -m "chore: refresh version-drift leaderboard"
          git push
